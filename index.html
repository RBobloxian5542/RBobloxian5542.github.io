  <script src="site.js"></script>
  <script>
    const tabButtons = document.querySelectorAll('.tab-button');
    const panels = {
      about: document.getElementById('about-panel'),
      creations: document.getElementById('creations-panel')
    };

    tabButtons.forEach((button) => {
      button.addEventListener('click', () => {
        const selected = button.dataset.tab;
        tabButtons.forEach((tab) => {
          const isSelected = tab === button;
          tab.classList.toggle('active', isSelected);
          tab.setAttribute('aria-selected', String(isSelected));
        });
        Object.entries(panels).forEach(([key, panel]) => {
          panel.hidden = key !== selected;
        });
      });
    });

    const featuredGrid = document.getElementById('featured-grid');
    const featuredViewButtons = document.querySelectorAll('[data-featured-view]');
    let featuredItems = [];
    let featuredIndex = 0;
    let featuredView = 'list';

    function formatCompactCount(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return '—';
      if (number >= 1000000000) return `${Math.floor(number / 1000000000)}B`;
      if (number >= 1000000) return `${Math.floor(number / 1000000)}M`;
      if (number >= 1000) return `${Math.floor(number / 1000)}K`;
      return String(Math.floor(number));
    }

    const featuredStatIcons = {
      players: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="3"/><path d="M5.5 20c.3-3.8 2.4-6 6.5-6s6.2 2.2 6.5 6"/></svg>',
      visits: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.3-6 9.5-6 9.5 6 9.5 6-3.3 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>'
    };

    async function fetchCurrentActive(game) {
      if (!game.universeId) return null;
      try {
        const response = await fetch(`https://games.roblox.com/v1/games?universeIds=${encodeURIComponent(game.universeId)}`);
        if (!response.ok) return null;
        const result = await response.json();
        return result?.data?.[0]?.playing ?? null;
      } catch {
        return null;
      }
    }

    async function fetchGameIcons(games) {
      const universeIds = games.map((game) => game.universeId).filter(Boolean);
      if (!universeIds.length) return games;

      try {
        const endpoint = `https://thumbnails.roblox.com/v1/games/icons?universeIds=${encodeURIComponent(universeIds.join(','))}&size=420x420&format=Png&isCircular=false`;
        const response = await fetch(endpoint);
        if (!response.ok) return games;
        const result = await response.json();
        const icons = new Map((result.data || []).map((item) => [String(item.targetId), item.state === 'Completed' ? item.imageUrl : null]));
        return games.map((game) => ({
          ...game,
          icon: icons.get(String(game.universeId)) || game.thumb
        }));
      } catch {
        return games;
      }
    }

    function renderFeatured() {
      if (!featuredItems.length) {
        featuredGrid.innerHTML = '<p class="muted">Featured work could not be loaded.</p>';
        return;
      }

      if (featuredView === 'grid') {
        featuredGrid.classList.add('featured-grid-view');
        featuredGrid.innerHTML = featuredItems.map((game) => `
          <a class="creation-card" href="games/game.html?game=${encodeURIComponent(game.slug)}">
            <img src="${game.icon || game.thumb}" alt="${game.title}">
            <div class="creation-card-info">
              <h3 class="creation-card-title">${game.title}</h3>
              <div class="creation-card-meta">
                <span class="creation-stat" title="Current players">${featuredStatIcons.players}<span>${formatCompactCount(game.ccu)}</span></span>
                <span class="creation-stat" title="Visits">${featuredStatIcons.visits}<span>${formatCompactCount(game.visits)}</span></span>
              </div>
            </div>
          </a>
        `).join('');
        return;
      }

      featuredGrid.classList.remove('featured-grid-view');
      const game = featuredItems[featuredIndex];
      featuredGrid.innerHTML = `
        <div class="experience-card">
          <div class="experience-media">
            <a class="experience-media-link" href="games/game.html?game=${encodeURIComponent(game.slug)}" aria-label="Open ${game.title}">
              <img src="${game.icon || game.thumb}" alt="${game.title}">
            </a>
          </div>
          <div class="experience-details">
            <h3>${game.title}</h3>
            <p>${game.description || 'Roblox project.'}</p>
            <div class="experience-stats">
              <span class="experience-stat">Active<strong>${formatCompactCount(game.ccu)}</strong></span>
              <span class="experience-stat">Visits<strong>${formatCompactCount(game.visits)}</strong></span>
            </div>
          </div>
          <button class="experience-arrow prev" type="button" data-featured-nav="previous" aria-label="Previous creation">‹</button>
          <button class="experience-arrow next" type="button" data-featured-nav="next" aria-label="Next creation">›</button>
          <div class="experience-loading" aria-hidden="true"></div>
        </div>
      `;

      const loading = featuredGrid.querySelector('.experience-loading');
      window.setTimeout(() => loading?.remove(), 1000);
    }

    featuredGrid.addEventListener('click', (event) => {
      const button = event.target.closest('[data-featured-nav]');
      if (!button) return;
      event.preventDefault();
      featuredIndex = button.dataset.featuredNav === 'next'
        ? (featuredIndex + 1) % featuredItems.length
        : (featuredIndex - 1 + featuredItems.length) % featuredItems.length;
      renderFeatured();
    });

    featuredViewButtons.forEach((button) => {
      button.addEventListener('click', () => {
        featuredView = button.dataset.featuredView;
        featuredViewButtons.forEach((viewButton) => {
          const isSelected = viewButton === button;
          viewButton.classList.toggle('active', isSelected);
          viewButton.setAttribute('aria-pressed', String(isSelected));
        });
        renderFeatured();
      });
    });

    fetch('games.json')
      .then((response) => response.json())
      .then((games) => {
        featuredItems = games
          .filter((game) => !game.hide)
          .sort((a, b) => (a.order || 0) - (b.order || 0));
        return Promise.all(featuredItems.map(async (game) => {
          game.ccu = await fetchCurrentActive(game);
          return game;
        }));
      })
      .then((games) => {
        featuredItems = games;
        return fetchGameIcons(featuredItems);
      })
      .then((games) => {
        featuredItems = games;
        renderFeatured();
      })
      .catch(() => renderFeatured());

    const avatarToggle = document.getElementById('avatar-toggle');
    const bannerAvatar = document.querySelector('[data-profile-avatar]');
    let avatarMode = '2d';

    function syncAvatarToggle() {
      const hasThreeD = Boolean(window.robloxProfileMedia?.avatar3d?.imageUrl);
      avatarToggle.title = hasThreeD
        ? `Switch to ${avatarMode === '2d' ? '3D' : '2D'} avatar view`
        : '3D preview unavailable; using a visual fallback';
    }

    syncAvatarToggle();
    window.addEventListener('roblox-profile-media-ready', syncAvatarToggle);
    avatarToggle.addEventListener('click', () => {
      avatarMode = avatarMode === '2d' ? '3d' : '2d';
      avatarToggle.textContent = avatarMode.toUpperCase();
      avatarToggle.setAttribute('aria-pressed', String(avatarMode === '3d'));
      const threeDImage = window.robloxProfileMedia?.avatar3d?.imageUrl;
      if (avatarMode === '3d' && threeDImage) {
        bannerAvatar.src = threeDImage;
        bannerAvatar.classList.remove('avatar-rotation-fallback');
      } else if (avatarMode === '3d') {
        bannerAvatar.classList.add('avatar-rotation-fallback');
      } else {
        bannerAvatar.src = window.robloxProfileMedia?.avatar || 'Images/Avatar.png';
        bannerAvatar.classList.remove('avatar-rotation-fallback');
      }
      syncAvatarToggle();
    });
  </script>
