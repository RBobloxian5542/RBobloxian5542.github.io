<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UI & Effects — RBobloxian5542</title>
  <link rel="stylesheet" href="../site.css">
</head>
<body data-root=".." data-active="home">
  <div id="page-content">
    <div class="catalog-page">
      <div class="catalog-header">
        <div>
          <h1>UI & Effects</h1>
          <p>Interface work, animations, and visual effects.</p>
        </div>
      </div>
      <div class="catalog-grid" id="ui-grid"></div>
    </div>
  </div>

  <script src="../site.js"></script>
  <script>
    fetch('../ui.json')
      .then((response) => response.json())
      .then((items) => {
        const visibleItems = items.filter((item) => !item.hide).sort((a, b) => (a.order || 0) - (b.order || 0));
        document.getElementById('ui-grid').innerHTML = visibleItems.map((item) => `
          <a class="catalog-card" href="item.html?item=${encodeURIComponent(item.slug)}">
            ${item.thumb ? `<img src="../Images/UIThumbnails/${item.thumb}" alt="${item.title}">` : '<div class="catalog-thumb-placeholder">No thumbnail</div>'}
            <div class="catalog-card-body">
              <span class="tag">${item.tag || 'UI'}</span>
              <h2 class="catalog-card-title">${item.title}</h2>
              <span class="catalog-card-meta">${item.description || ''}</span>
            </div>
          </a>
        `).join('');
      })
      .catch(() => {
        document.getElementById('ui-grid').innerHTML = '<p class="empty-state">UI work could not be loaded.</p>';
      });
  </script>
</body>
</html>
