<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creations — RBobloxian5542</title>
  <link rel="stylesheet" href="../site.css">
</head>
<body data-root=".." data-active="home">
  <div id="page-content">
    <div class="catalog-page">
      <div class="catalog-header">
        <div>
          <h1>Creations</h1>
          <p>Games I have scripted, led, or contributed to.</p>
        </div>
      </div>
      <div class="catalog-grid" id="games-grid"></div>
    </div>
  </div>

  <script src="../site.js"></script>
  <script>
    function formatVisits(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return '—';
      if (number >= 1000000) return `${(number / 1000000).toFixed(1).replace('.0', '')}M`;
      if (number >= 1000) return `${(number / 1000).toFixed(1).replace('.0', '')}K`;
      return String(number);
    }

    fetch('../games.json')
      .then((response) => response.json())
      .then((games) => {
        const visibleGames = games.filter((game) => !game.hide).sort((a, b) => (a.order || 0) - (b.order || 0));
        document.getElementById('games-grid').innerHTML = visibleGames.map((game) => `
          <a class="catalog-card" href="game.html?game=${encodeURIComponent(game.slug)}">
            <img src="${game.thumb}" alt="${game.title}">
            <div class="catalog-card-body">
              <span class="tag">${game.tag || 'Roblox project'}</span>
              <h2 class="catalog-card-title">${game.title}</h2>
              <span class="catalog-card-meta">${formatVisits(game.visits)} visits</span>
            </div>
          </a>
        `).join('');
      })
      .catch(() => {
        document.getElementById('games-grid').innerHTML = '<p class="empty-state">Creations could not be loaded.</p>';
      });
  </script>
</body>
</html>
