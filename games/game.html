<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game — RBobloxian5542</title>
  <link rel="stylesheet" href="../site.css">
</head>
<body data-root=".." data-active="home" data-data-file="../games.json" data-image-root="../Images/Showcases/" data-thumb-root="../Images/" data-query-key="game">
  <div id="page-content">
    <div class="detail-page">
      <div class="detail-hero">
        <div class="detail-video" id="detail-video" hidden></div>
        <div class="detail-fallback" id="detail-fallback" hidden></div>
        <div class="detail-info">
          <h1 id="detail-title">Loading...</h1>
          <div class="detail-role" id="detail-role"></div>
          <div class="detail-visits" id="detail-visits"></div>
          <a class="detail-link" id="detail-link" href="#" target="_blank" rel="noreferrer" hidden>Play on Roblox</a>
        </div>
      </div>

      <div class="detail-description" id="detail-description">Loading project data...</div>

      <section class="media-carousel" id="media-carousel" hidden>
        <h2>Images</h2>
        <div class="carousel-frame">
          <img id="carousel-image" src="" alt="Project screenshot">
          <button class="carousel-button prev" id="carousel-prev" type="button" aria-label="Previous image">‹</button>
          <button class="carousel-button next" id="carousel-next" type="button" aria-label="Next image">›</button>
        </div>
        <div class="carousel-counter" id="carousel-counter"></div>
      </section>
    </div>
  </div>

  <script src="../site.js"></script>
  <script src="../detail-page.js"></script>
</body>
</html>
