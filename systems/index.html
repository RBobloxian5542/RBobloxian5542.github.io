<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Systems — RBobloxian5542</title>
  <link rel="stylesheet" href="../site.css">
</head>
<body data-root=".." data-active="home">
  <div id="page-content">
    <div class="catalog-page">
      <div class="catalog-header">
        <div>
          <h1>Systems</h1>
          <p>Reusable Roblox systems and development work.</p>
        </div>
      </div>
      <div class="catalog-grid" id="systems-grid"></div>
    </div>
  </div>

  <script src="../site.js"></script>
  <script>
    fetch('../systems.json')
      .then((response) => response.json())
      .then((systems) => {
        const visibleSystems = systems.filter((system) => !system.hide).sort((a, b) => (a.order || 0) - (b.order || 0));
        document.getElementById('systems-grid').innerHTML = visibleSystems.map((system) => `
          <a class="catalog-card" href="system.html?system=${encodeURIComponent(system.slug)}">
            ${system.thumb ? `<img src="../Images/SystemThumbnails/${system.thumb}" alt="${system.title}">` : '<div class="catalog-thumb-placeholder">No thumbnail</div>'}
            <div class="catalog-card-body">
              <h2 class="catalog-card-title">${system.title}</h2>
              <span class="catalog-card-meta">${system.broadDescription || ''}</span>
            </div>
          </a>
        `).join('');
      })
      .catch(() => {
        document.getElementById('systems-grid').innerHTML = '<p class="empty-state">Systems could not be loaded.</p>';
      });
  </script>
</body>
</html>
